[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adventure-receptionist"
version = "0.1.0"
description = "Model-agnostic agent orchestration control plane for Adventure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
buzz = "buzz.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/buzz"]
